name: Hospital Platform CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FRONTEND_DIST: apps/frontend/dist
  IMAGE_NAME: sanctuary-plus-backend
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

permissions:
  contents: read

jobs:
  lint-quality:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://sanctuary:sanctuary_dev@localhost:5432/sanctuary

      - name: Type check backend
        run: npx tsc --noEmit -p apps/backend/tsconfig.runtime.json

      - name: Type check frontend
        run: npx tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Check formatting
        continue-on-error: true
        run: npx prettier --check .

      - name: Lint
        continue-on-error: true
        run: npx eslint apps/backend/src apps/frontend/src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --passWithNoTests

  build-artifacts:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://sanctuary:sanctuary_dev@localhost:5432/sanctuary

      - name: Build backend
        run: npx tsc -p apps/backend/tsconfig.build.json

      - name: Build frontend
        run: npx vite build --config apps/frontend/vite.config.ts
        env:
          NODE_ENV: production
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIST }}
          retention-days: 7

  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-artifacts, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build --file apps/backend/Dockerfile --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Save image for Trivy
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > backend-image.tar.gz

      - name: Upload image for Trivy
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load backend image
        run: gunzip -c backend-image.tar.gz | docker load

      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.sarif

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-artifacts, trivy-scan]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages bundle
        run: |
          touch frontend-dist/.nojekyll
          cp frontend-dist/index.html frontend-dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-dist

      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Verify deployment
        continue-on-error: true
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --silent --show-error "${{ env.PAGES_URL }}"
          echo "GitHub Pages is responding at ${{ env.PAGES_URL }}"

  owasp-zap:
    name: OWASP ZAP Scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.PAGES_URL }}

  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      [
        lint-quality,
        unit-tests,
        build-artifacts,
        security-scan,
        docker-build,
        trivy-scan,
        deploy,
        owasp-zap,
      ]
    steps:
      - name: Write summary
        run: |
          {
            echo "# Hospital Platform CI/CD"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Lint & Formatting | ${{ needs.lint-quality.result }} |"
            echo "| Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| Build Artifact | ${{ needs.build-artifacts.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Docker Build | ${{ needs.docker-build.result }} |"
            echo "| Trivy Scan | ${{ needs.trivy-scan.result }} |"
            echo "| GitHub Pages Deploy | ${{ needs.deploy.result }} |"
            echo "| OWASP ZAP | ${{ needs.owasp-zap.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
