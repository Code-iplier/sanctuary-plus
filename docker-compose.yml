services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sanctuary
      POSTGRES_USER: sanctuary
      POSTGRES_PASSWORD: sanctuary_dev
    ports:
      - '${SANCTUARY_POSTGRES_PORT:-5434}:5432'
    volumes:
      - sanctuary-plus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanctuary -d sanctuary']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sanctuary

  chronos:
    build:
      context: ./services/chronos
      dockerfile: Dockerfile
    expose:
      - '8000'
    environment:
      PORT: 8000
      # Mount a local MIMIC demo directory here; it is intentionally gitignored.
      CHRONOS_DATA_DIR: /app/data
    volumes:
      - ${CHRONOS_DATA_PATH:-./services/chronos/data}:/app/data:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).read() else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sanctuary
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    expose:
      - '3000'
    environment:
      PORT: 3000
      CHRONOS_BASE_URL: http://chronos:8000
      DATABASE_URL: postgresql://sanctuary:sanctuary_dev@postgres:5432/sanctuary
      JWT_SECRET: ${JWT_SECRET:-sanctuary-development-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.5-transcribe}
      GEMINI_DOCUMENT_MODEL: ${GEMINI_DOCUMENT_MODEL:-gemini-3.1-flash-lite}
      GEMINI_DIAGNOSIS_MODEL: ${GEMINI_DIAGNOSIS_MODEL:-gemini-3.6-flash}
      GEMINI_PRESCRIPTION_MODEL: ${GEMINI_PRESCRIPTION_MODEL:-gemini-3.6-flash}
      GEMINI_SOAP_MODEL: ${GEMINI_SOAP_MODEL:-gemini-3.5-flash-lite}
      MEDIKIOSK_USE_EPHEMERAL_TOKENS: ${MEDIKIOSK_USE_EPHEMERAL_TOKENS:-true}
      MEDIKIOSK_TRIAGE_MODE: ${MEDIKIOSK_TRIAGE_MODE:-SHADOW}
      NODE_ENV: production
    depends_on:
      chronos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/chronos/summary']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sanctuary
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${SANCTUARY_FRONTEND_PORT:-8081}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanctuary
    restart: unless-stopped

networks:
  sanctuary:
    driver: bridge

volumes:
  sanctuary-plus-postgres:
    name: ${SANCTUARY_POSTGRES_VOLUME:-sanctuary-plus-postgres}
