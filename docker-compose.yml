services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sanctuary
      POSTGRES_USER: sanctuary
      POSTGRES_PASSWORD: sanctuary_dev
    ports:
      - '5433:5432'
    volumes:
      - sanctuary-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanctuary -d sanctuary']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sanctuary

  chronos:
    build:
      context: ./services/chronos
      dockerfile: Dockerfile
    expose:
      - '8000'
    environment:
      PORT: 8000
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).read() else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sanctuary
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    expose:
      - '3000'
    environment:
      PORT: 3000
      CHRONOS_BASE_URL: http://chronos:8000
      DATABASE_URL: postgresql://sanctuary:sanctuary_dev@postgres:5432/sanctuary
      JWT_SECRET: ${JWT_SECRET:-sanctuary-development-secret-change-me}
      NODE_ENV: production
    depends_on:
      chronos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/chronos/summary']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sanctuary
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanctuary
    restart: unless-stopped

networks:
  sanctuary:
    driver: bridge

volumes:
  sanctuary-postgres:
